        function dedupAndMerge() {
            const seen = new Set();
            const result = [];
            let dupCount = 0;
            const counts = { ngosang: 0, newtrackon: 0, community: 0 };

            Object.entries(RAW).forEach(([src, urls]) => {
                urls.forEach(url => {
                    const key = url.replace(/\/+$/, '').toLowerCase();
                    if (seen.has(key)) { dupCount++; return; }
                    seen.add(key);
                    result.push({ url, sources: [src] });
                    counts[src]++;
                });
            });

            return { list: result, dupCount, counts };
        }

        const MERGED = dedupAndMerge();

        function protoOf(url) {
            if (url.startsWith('udp://')) return 'udp';
            if (url.startsWith('wss://')) return 'wss';
            if (url.startsWith('ws://')) return 'ws';
            if (url.startsWith('https://')) return 'https';
            if (url.startsWith('http://')) return 'http';
            return '?';
        }

        function srcLabel(s) {
            return { ngosang: 'ngosang', newtrackon: 'newTrackon', community: '社区' }[s] || s;
        }

        let activeFilter = 'all';
        let activeSource = 'all';
        let activeFormat = 'plain';
        let toastTimer = null;

        const DOM = {
            list: document.getElementById('trackerList'),
            toast: document.getElementById('toast'),
            mobileToggle: document.getElementById('mobileToggle'),
            navLinks: document.getElementById('navLinks'),
            totalCount: document.getElementById('totalCount'),
            shownCount: document.getElementById('shownCount'),
            dedupCount: document.getElementById('dedupCount'),
            srcNgosang: document.getElementById('srcNgosang'),
            srcNewtrackon: document.getElementById('srcNewtrackon'),
            srcCommunity: document.getElementById('srcCommunity'),
            copyBtn: document.getElementById('copyBtn'),
            downloadBtn: document.getElementById('downloadBtn'),
        };

        DOM.totalCount.textContent = MERGED.list.length;
        DOM.dedupCount.textContent = MERGED.dupCount;
        DOM.srcNgosang.textContent = MERGED.counts.ngosang;
        DOM.srcNewtrackon.textContent = MERGED.counts.newtrackon;
        DOM.srcCommunity.textContent = MERGED.counts.community;

        function toast(msg) {
            clearTimeout(toastTimer);
            DOM.toast.textContent = msg;
            DOM.toast.classList.add('visible');
            toastTimer = setTimeout(() => DOM.toast.classList.remove('visible'), 2500);
        }

        function getFiltered() {
            let list = MERGED.list;
            if (activeSource !== 'all') list = list.filter(d => d.sources.includes(activeSource));
            if (activeFilter !== 'all') list = list.filter(d => protoOf(d.url) === activeFilter);
            return list;
        }

        function getExportText(list, format) {
            const urls = list.map(d => d.url);
            switch (format) {
                case 'comma': return urls.join(', ');
                case 'aria2': return urls.map(u => u.endsWith('/announce') ? u : u + '/announce').join('\n');
                case 'qbittorrent': return urls.join('\n');
                default: return urls.join('\n');
            }
        }

        function renderList() {
            const filtered = getFiltered();
            DOM.shownCount.textContent = filtered.length;

            if (!filtered.length) {
                DOM.list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><h3>没有匹配的 tracker</h3></div>';
                return;
            }

            const frag = document.createDocumentFragment();
            filtered.forEach(d => {
                const p = protoOf(d.url);
                const src = d.sources[0];
                const div = document.createElement('div');
                div.className = 'tracker-row';
                div.innerHTML = `
                    <span class="tracker-proto ${p}">${p.toUpperCase()}</span>
                    <span class="tracker-url-txt">${d.url}</span>
                    <span class="tracker-source">${srcLabel(src)}</span>
                    <button class="tracker-copy" data-url="${d.url.replace(/"/g,'&quot;')}">复制</button>
                `;
                frag.appendChild(div);
            });
            DOM.list.innerHTML = '';
            DOM.list.appendChild(frag);
        }

        DOM.list.addEventListener('click', e => {
            const btn = e.target.closest('.tracker-copy');
            if (!btn) return;
            navigator.clipboard.writeText(btn.dataset.url).then(() => toast('已复制')).catch(() => toast('复制失败'));
        });

        document.querySelectorAll('[data-filter]').forEach(btn => {
            btn.addEventListener('click', () => {
                const parent = btn.parentElement;
                parent.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = btn.dataset.filter;
                renderList();
            });
        });

        document.querySelectorAll('[data-src]').forEach(btn => {
            btn.addEventListener('click', () => {
                const parent = btn.parentElement;
                parent.querySelectorAll('[data-src]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeSource = btn.dataset.src;
                renderList();
            });
        });

        document.querySelectorAll('[data-format]').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.parentElement.querySelectorAll('[data-format]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFormat = btn.dataset.format;
            });
        });

        DOM.copyBtn.addEventListener('click', () => {
            const list = getFiltered();
            if (!list.length) { toast('没有可复制的 tracker'); return; }
            const text = getExportText(list, activeFormat);
            navigator.clipboard.writeText(text).then(() => toast(`已复制 ${list.length} 条 (${activeFormat})`)).catch(() => toast('复制失败'));
        });

        DOM.downloadBtn.addEventListener('click', () => {
            const list = getFiltered();
            if (!list.length) { toast('没有可下载的 tracker'); return; }
            const text = getExportText(list, activeFormat);
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'trackers.txt'; a.click();
            URL.revokeObjectURL(url);
            toast(`已下载 ${list.length} 条 tracker`);
        });

        DOM.mobileToggle.addEventListener('click', () => DOM.navLinks.classList.toggle('open'));

        (function initTheme() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
            }
            document.getElementById('themeToggle').textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
        })();

        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        renderList();
    </script>
